name: Payment API checks

on:
  push:
    branches: [main]
    paths:
      - 'labs/payment-reliability-api/**'
      - '.github/workflows/payment-reliability-api.yml'
  pull_request:
    paths:
      - 'labs/payment-reliability-api/**'
      - '.github/workflows/payment-reliability-api.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/payment-reliability-api
    steps:
      - uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: labs/payment-reliability-api/pom.xml
      - name: Run tests and package
        run: mvn -B verify
