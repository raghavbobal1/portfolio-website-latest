name: Check site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run site tests
        run: python3 -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: node --check script.js
